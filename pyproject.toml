[tool.poetry]
name = "websec-auditor"
version = "0.1.0"
description = "API para auditoría pasiva de cabeceras HTTP"
authors = ["Jonathan Jimenez <jonathan@example.com>"]
packages = [{ include = "websec_auditor", from = "src" }]


[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100"
uvicorn = {extras = ["standard"], version = "^0.22"}
httpx = "^0.24"
sqlmodel = "^0.0.8"
python-dotenv = "^1.0"


[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^24.0"
ruff = "^0.28"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

