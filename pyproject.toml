[project]
name = "websec-auditor"
version = "0.1.0"
description = "API para auditoría pasiva de cabeceras HTTP"
authors = [
    { name = "Jonathan Jimenez", email = "jonathan@example.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.28,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "black>=24.0,<27.0",
    "ruff>=0.8,<1.0"
]

[tool.poetry]
packages = [
    { include = "websec_auditor", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
